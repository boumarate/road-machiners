name: factory-caddy

services:
  caddy:
    container_name: factory-caddy
    image: caddy:2.10-alpine
    restart: unless-stopped
    # Docker skips UFW for published ports, and daemon.json binds them to 127.0.0.1 unless a port names its address.
    # Caddy is the one service that asks for public ports. deploy.py fails on any other published port.
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      DOMAIN: ${FACTORY_DOMAIN:?set FACTORY_DOMAIN}
      ACME_EMAIL: ${FACTORY_ACME_EMAIL:?set FACTORY_ACME_EMAIL}
      ITCH_URL: ${FACTORY_ITCH_URL:?set FACTORY_ITCH_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/factory/www:/srv/www:ro
      - /opt/factory/caddy/data:/data
      - /opt/factory/caddy/config:/config
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
