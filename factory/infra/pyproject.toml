[project]
name = "roam-factory-infra"
version = "0.1.0"
description = "Provisioning and deploy for the ROAM game factory server"
requires-python = ">=3.11"
dependencies = ["pyinfra==3.9.2", "pydantic-settings==2.14.1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["factory_infra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
