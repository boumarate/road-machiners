name: Feature request
description: Suggest a change to the game. Thumbs-up votes decide what the factory builds.
labels: [feature-request]
body:
  - type: textarea
    id: idea
    attributes:
      label: What should change?
      description: Describe one change. Say what the player sees or does after it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve, or what does it make more fun?
    validations:
      required: true
